[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-optimizer"
version = "0.1.0"
description = "Experimental external cognitive augmentation for Mistral Vibe Code"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vibe-brain = "vibe_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.vibe-optimizer]
status = "research-bootstrap"
mcp-server-enabled = false
